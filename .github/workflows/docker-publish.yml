name: Docker image

# Manual only: builds the Asciidoctor publishing image from the root Dockerfile and
# pushes it to ghcr.io/openehr/asciidoctor. Mirrors the `docker` job of the
# bmm-publisher release workflow (same actions, same login/metadata/build steps).
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image to ghcr.io (untick for a build-and-test dry run)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openehr/asciidoctor

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: asciidoctor-smoke:test

      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh asciidoctor-smoke:test -c '
            set -e
            asciidoctor --version
            jq --version
            command -v bc
            command -v spec_publish.sh
            for gem in asciidoctor-diagram asciidoctor-bibtex asciidoctor-tabs asciidoctor-pdf; do
              gem list -i "$gem" >/dev/null || { echo "missing gem: $gem"; exit 1; }
            done'

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
